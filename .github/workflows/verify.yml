name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The gate now builds the shipped release and runs the declared flake
    # checks as well as bin/verify, so it needs more than the 20 minutes the
    # single-step job used.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.nixos.org https://devenv.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Verify
        run: nix develop --impure --command bin/verify

      # bin/verify never touches the flake outputs, so until these three steps
      # existed the shipped release, the declared checks and the four Nix
      # modules were neither built nor evaluated by any gate.
      # Not --all-systems: devenv's dev shell reads a derivation at evaluation
      # time (tasks.nix imports one), and for a system the runner cannot build
      # that import fails with "path ...-source.drv is not valid". CI run
      # 35411391330 failed exactly there, on devShells.aarch64-linux, after
      # every package on all three systems had evaluated. So the dev shell is
      # checked on the runner's own system, where it is also used, and the
      # outputs that ship are evaluated on every declared system below.
      - name: Evaluate this runner's outputs and the Nix modules
        run: nix flake check --no-build --impure

      - name: Evaluate every package and check on every supported system
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            for output in packages checks; do
              echo "== $output.$system"
              nix eval --impure --json ".#$output.$system" \
                --apply 'outputs: builtins.mapAttrs (_: drv: drv.drvPath) outputs'
            done
          done

      - name: Build the shipped artifacts
        run: nix build --no-link --print-out-paths .#default .#ap .#manifest

      - name: Run declared flake checks
        run: nix flake check --impure
